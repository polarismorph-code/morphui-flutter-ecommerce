name: morphui_flutter_ecommerce
description: Production-grade Flutter e-commerce demonstrating Morph SDK features.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  morphui: ^0.1.3

  # Routing
  go_router: ^13.2.0

  # State management
  flutter_riverpod: ^2.4.10

  # Utilities
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
